<header class="practice-intro">
  <a class="back" href="../../#cards">← 所有練習卡</a>
  <p class="practice-meta"><span class="meta-label">練習 $number</span><span class="level">$level</span></p>
  <h1>$title</h1>
  <p class="lead">$summary</p>
</header>
<section class="practice-panel" aria-labelledby="score-title">
  <div class="score-heading">
    <div><h2 id="score-title">節奏譜</h2><p class="meta-label">4/4 拍，1 小節</p></div>
    <div class="player-controls" data-player>
      <label class="tempo-control" for="tempo">速度 <input id="tempo" type="number" min="40" max="180" step="1" value="$tempo" inputmode="numeric" required> BPM</label>
      <button class="button" type="button" id="play-pattern" aria-pressed="false">播放節奏</button>
    </div>
  </div>
  <div class="score-scroll" tabindex="0" role="region" aria-label="可水平捲動的節奏譜">$score</div>
  <ul class="legend"><li><b class="mark">x</b> 一般敲擊</li><li><b class="mark accent-mark">X</b> 重音</li><li><b class="mark quiet">−</b> 休止</li></ul>
  <p id="player-status" class="player-status" role="status">這張卡預設 $tempo BPM，播放時會重複這一小節。</p>
</section>
<div class="practice-body">
  <section class="steps" aria-labelledby="steps-title">
    <h2 id="steps-title">練習步驟</h2>
    <ol>$steps</ol>
  </section>
  <aside class="checkpoint" aria-labelledby="check-title">
    <h2 id="check-title">容易打錯的地方</h2>
    <p>$checkpoint</p>
  </aside>
</div>
<nav class="card-navigation" aria-label="練習卡導覽">
  <a class="back" href="../../#cards">← 所有練習卡</a>
  $next_link
</nav>
